<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FareScout Day 1 route challenge animation for TikTok and Reels.">
    <meta name="theme-color" content="#10252b">
    <title>FareScout Route Challenge</title>
    <link rel="icon" type="image/png" href="/assets/farescout-logo.png">
    <link rel="apple-touch-icon" href="/assets/farescout-logo.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="story-body">
    <main class="story-frame" aria-label="FareScout TikTok route challenge animation">
      <section class="story-scene">
        <div class="story-brand">
          <img src="/assets/farescout-logo.png" alt="FareScout logo">
          <span>FareScout</span>
        </div>

        <div class="story-copy">
          <p class="story-kicker">Route challenge</p>
          <h1>Drop your route.</h1>
          <span>I will scout 10 routes with FareScout.</span>
        </div>

        <div class="story-phone" aria-label="Animated FareScout route examples">
          <div class="story-app-top">
            <strong>Live fare search</strong>
            <em>Alerts next</em>
          </div>
          <div class="story-route story-route-one">
            <span>NYC</span>
            <b></b>
            <span>MIA</span>
            <small>under $120</small>
          </div>
          <div class="story-route story-route-two">
            <span>WAW</span>
            <b></b>
            <span>LTN</span>
            <small>under 400 PLN</small>
          </div>
          <div class="story-result">
            <p>Cheapest found</p>
            <strong>312 PLN</strong>
          </div>
        </div>

        <div class="story-cta">
          <strong>Comment your route + target price</strong>
          <span>farescout.onrender.com</span>
        </div>
      </section>
    </main>
  </body>
</html>
